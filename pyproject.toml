[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "algo-backtester"
version = "0.1.0"
description = "Production-grade event-driven algorithmic trading backtesting platform"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "yfinance>=0.2.36",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "streamlit>=1.30",
    "plotly>=5.18",
    "matplotlib>=3.8",
    "python-dotenv>=1.0",
    "pyarrow>=14.0",
    "pandas_market_calendars>=4.4",
    "filelock>=3.13",
    "gitpython>=3.1.58",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.2",
    "mypy>=1.8",
    "ruff>=0.3",
    "pandas-stubs>=2.0",
    "httpx2>=2.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
artifacts = ["src/analytics/sql/**/*.sql"]

[tool.hatch.build.targets.wheel.force-include]
"alembic.ini" = "alembic.ini"
"alembic/env.py" = "alembic/env.py"
"alembic/script.py.mako" = "alembic/script.py.mako"
"alembic/versions/455406e2c7ac_initial_schema.py" = "alembic/versions/455406e2c7ac_initial_schema.py"
"alembic/versions/20260804_01_harden_analytics_integrity.py" = "alembic/versions/20260804_01_harden_analytics_integrity.py"

[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
omit = ["src/dashboard/*"]
